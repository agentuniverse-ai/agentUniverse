name: 'tiny_prefix_cluster_tool'
description: |
  1-char prefix clusters over 10 items, lex order. (au1k series #5, text)

  Actions:
    - action=run: apply the documented default parameterization to x.
    - action=alt: apply the alternative parameterization (see provenance).
    - action=meta: return assignment provenance without computing.

  Any p1..p4 passed explicitly overrides the assignment value. The tool runs
  fully offline on stdlib reasoning; malformed inputs raise ValueError. x is a
  string, list, dict or number accepted by the wrapped algorithm; outputs are
  bounded JSON-serializable dicts.
tool_type: 'func'
input_keys: ['action']
metadata:
  type: 'TOOL'
  module: 'agentuniverse.agent.action.tool.common_tool.au_5_tiny_prefix_cluster'
