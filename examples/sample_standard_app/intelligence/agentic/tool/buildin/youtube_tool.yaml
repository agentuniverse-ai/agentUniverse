name: 'youtube_tool'
description: |
  该工具基于 YouTube Data API v3 检索视频信息。工具支持两种操作模式：
  1. 搜索视频：通过关键词搜索 youtube 视频
  2. 获取视频详情：通过视频 ID 获取标题、时长、播放量、点赞数和评论数等统计信息

  使用前需配置环境变量 YOUTUBE_API_KEY。

  工具输入示例：
    模式1 - 搜索视频：
      query: "machine learning"
      mode: "search"
      max_results: 5

    模式2 - 获取视频详情：
      video_id: "dQw4w9WgXcQ"
      mode: "videos"
      （video_id 也支持逗号分隔的多个视频 ID，最多 10 个）
tool_type: 'api'
input_keys: ['mode']
metadata:
  type: 'TOOL'
  module: 'agentuniverse.agent.action.tool.common_tool.youtube_tool'
  class: 'YouTubeTool'
