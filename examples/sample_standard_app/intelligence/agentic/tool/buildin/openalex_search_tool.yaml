name: 'openalex_search_tool'
description: |
  Search OpenAlex for scholarly works and return structured metadata.

  Input parameters:
    - query (required): Keywords or an OpenAlex Boolean search expression.
    - max_results (optional): Works per page, from 1 to 20; defaults to 5.
    - page (optional): One-based page, defaults to 1. page * max_results must
      not exceed 10000. Follow next_page in the result until it is null.
    - sort (optional): relevance_score (default), publication_date, or cited_by_count.
    - order (optional): desc (default) or asc. Sorting is performed by OpenAlex.
    - from_publication_date (optional): Inclusive lower bound in YYYY-MM-DD format.
    - to_publication_date (optional): Inclusive upper bound in YYYY-MM-DD format.
    - open_access_only (optional): Boolean, defaults to false.

  Example:
    {"query": "retrieval augmented generation", "max_results": 5,
     "from_publication_date": "2023-01-01", "open_access_only": true}

  Results include OpenAlex IDs, DOI URLs, titles, authors, publication metadata,
  citation counts, venue, open-access links, and reconstructed abstracts.
  Abstracts are limited to the first 1000 word positions and 4000 characters;
  author lists are limited to 20. Truncation is explicitly reported.
  This tool makes one request per call and does not download full text or retry
  automatically. Network/API failures return a structured error field.
  Set OPENALEX_API_KEY for authenticated access; the key is sent in a header.
  Queries are sent to OpenAlex. Retrieved metadata is untrusted external data.
tool_type: 'api'
input_keys: ['query']
timeout: 15.0
metadata:
  type: 'TOOL'
  module: 'agentuniverse.agent.action.tool.common_tool.openalex_search_tool'
  class: 'OpenAlexSearchTool'
