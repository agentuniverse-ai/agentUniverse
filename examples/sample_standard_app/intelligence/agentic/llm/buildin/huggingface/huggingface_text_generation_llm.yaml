name: 'huggingface_text_generation_llm'
description: 'huggingface native TGI text_generation task, supports top_k / repetition_penalty / do_sample'
model_name: 'meta-llama/Llama-3.1-8B-Instruct'
task: 'text_generation'
# point to a self hosted TGI server or a dedicated inference endpoint
# huggingface_base_url: 'http://127.0.0.1:8080'
max_tokens: 512
temperature: 0.7
top_p: 0.9
top_k: 40
repetition_penalty: 1.1
do_sample: true
seed: 42
streaming: true
metadata:
  type: 'LLM'
  module: 'agentuniverse.llm.default.huggingface_llm'
  class: 'HuggingFaceLLM'
