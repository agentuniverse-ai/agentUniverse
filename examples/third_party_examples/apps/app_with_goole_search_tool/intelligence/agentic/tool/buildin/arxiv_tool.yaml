name: 'arxiv_tool'
description: |
  该工具用于在arxiv上搜索和查看学术论文。工具支持两种操作模式：
  1. 搜索相关论文：通过关键词或描述搜索相关论文
  2. 查看论文详情：通过论文ID获取论文的完整信息

  工具输入示例：
    模式1 - 搜索论文：
      input: "large language model applications"
      mode: "search"
      max_results: 5  # 可选，返回数量为 1-100，默认 10
      sort_by: "submitted_date"  # 可选：relevance、submitted_date、last_updated_date；默认 relevance
      sort_order: "descending"  # 可选：descending、ascending；默认 descending
    
    模式2 - 查看论文详情：
      input: "2402.17550"  # arxiv论文ID
      mode: "detail"
tool_type: 'api'
input_keys: ['input', 'mode']
metadata:
  type: 'TOOL'
  module: 'agentuniverse.agent.action.tool.common_tool.arxiv_tool'
  class: 'ArxivTool'
