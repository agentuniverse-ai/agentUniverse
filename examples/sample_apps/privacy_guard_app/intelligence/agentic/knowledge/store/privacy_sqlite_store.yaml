# !/usr/bin/env python3
# -*- coding:utf-8 -*-

name: 'privacy_sqlite_store'
description: '基于 BM25 的本地 SQLite 工单存储，无需向量模型即可离线检索。'
db_path: 'intelligence/db/privacy_store.db'
k1: 1.5
b: 0.75
keyword_extractor: 'jieba_keyword_extractor'
similarity_top_k: 8
metadata:
    type: 'STORE'
    module: 'agentuniverse.agent.action.knowledge.store.sqlite_store'
    class: 'SQLiteStore'
