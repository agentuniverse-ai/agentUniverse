info:
  name: 'demo_judge_agent'
  description: 'Demo judge agent for scoring proposals and driving consensus'

profile:
  # Prompt configuration
  prompt_version: 'demo_judge_agent.cn'

  # LLM configuration
  llm_model:
    name: 'default_openai_llm'
    model_name: 'gpt-4o-2024-11-20'
    temperature: 0.3

  # Memory configuration
  memory:
    name: 'demo_memory'

metadata:
  type: 'AGENT'
  module: 'agentuniverse.agent.template.judge_agent_template'
  class: 'JudgeAgentTemplate'
