info:
  name: 'demo_proposer_agent'
  description: 'Demo proposer agent for drafting and revising proposals'

profile:
  # Prompt configuration
  prompt_version: 'demo_proposer_agent.cn'

  # LLM configuration
  llm_model:
    name: 'default_openai_llm'
    model_name: 'gpt-4o-2024-11-20'
    temperature: 0.7

  # Memory configuration
  memory:
    name: 'demo_memory'

metadata:
  type: 'AGENT'
  module: 'agentuniverse.agent.template.proposer_agent_template'
  class: 'ProposerAgentTemplate'
