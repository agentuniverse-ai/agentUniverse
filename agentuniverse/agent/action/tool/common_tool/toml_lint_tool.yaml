name: toml_lint_tool
description: TOML quality and style linting — pure Python stdlib tomllib plus a comment-stripped raw-text scan, no file I/O, no network. lint mode checks a document against a documented 10-rule table (mode='lint' — UTF-8 BOM, tomllib syntax errors with line/column mapped from the decode failure, duplicate tables/keys, multi-line inline tables and capitalized True/False all covered by the parse rule, mixed-scalar-type arrays, arrays mixing offset-aware and naive datetimes, trailing spaces, mixed tab/space indentation, inconsistent digit grouping in numbers, header-declared empty tables, nesting over a max_depth threshold, dotted-key and header table definitions mixed in one document), each finding carrying severity, 1-based line/column and a hint; profile mode aggregates tables, arrays-of-tables, key count, a scalar type histogram including date/datetime/time and the maximum path depth (mode='profile'); fix_hints mode applies the safe textual repairs only — BOM strip and trailing-whitespace trim outside multiline strings, never structural — and re-lints what remains (mode='fix_hints').
tool_type: api
metadata:
  type: TOOL
  module: agentuniverse.agent.action.tool.common_tool.toml_lint_tool
  class: TomlLintTool
input_keys:
  - mode
  - toml_text
args_model:
  mode:
    type: string
    description: Tool mode — lint, profile or fix_hints.
    required: true
  toml_text:
    type: string
    description: The TOML text to examine. A leading UTF-8 BOM is reported (rule TOML001) and stripped before any parsing. Required for every mode.
    required: true
  rules:
    type: object
    description: Map a rule code (TOML001..TOML010) to false to disable that single rule for the call, e.g. {"TOML005":false}. Unknown codes or non-boolean values raise ValueError. Lint mode only.
    required: false
  max_depth:
    type: integer
    description: TOML009 nesting threshold in key-path segments (dotted keys and nested headers both count). Default 12, range 1..128. Lint mode only.
    required: false
args_model_schema:
  type: object
  properties:
    mode:
      type: string
      enum: ["lint", "profile", "fix_hints"]
      description: Tool mode.
    toml_text:
      type: string
      description: TOML text (tomllib parsing; a single leading BOM is tolerated and reported).
    rules:
      type: object
      description: Per-rule enable/disable map, code -> boolean.
      additionalProperties:
        type: boolean
    max_depth:
      type: integer
      minimum: 1
      maximum: 128
      description: TOML009 nesting threshold (default 12).
  required: ["mode", "toml_text"]
