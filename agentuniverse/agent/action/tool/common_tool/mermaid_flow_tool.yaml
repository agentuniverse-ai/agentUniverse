name: mermaid_flow_tool
description: Mermaid diagram source generation tool — pure Python stdlib, no rendering and no mermaid CLI dependency. Builds flowchart TD/LR source from nodes/edges specs (mode='flowchart'), sequenceDiagram source from participants/messages/notes specs (mode='sequence'), and runs a basic sanity lint (declaration keyword, unbalanced quotes, reserved 'end' node id, dangling arrows) over a Mermaid source string (mode='lint').
tool_type: api
metadata:
  type: TOOL
  module: agentuniverse.agent.action.tool.common_tool.mermaid_flow_tool
  class: MermaidFlowTool
input_keys:
  - mode
args_model:
  mode:
    type: string
    description: Diagram mode — flowchart, sequence or lint.
    required: true
  direction:
    type: string
    description: Flowchart direction — TD (default) or LR. Flowchart mode only.
    required: false
  nodes:
    type: array
    description: Flowchart nodes, each {id, label?, shape?} with shape one of rect (default), round, stadium, diamond, hexagon, circle, parallelogram. Ids are sanitized to [A-Za-z0-9_] deterministically and the mapping is reported. Required for the flowchart mode.
    required: false
  edges:
    type: array
    description: Flowchart edges, each {from, to, label?, arrow?} with arrow one of arrow (--> default), dotted (-.->) or thick (==>); from/to must reference declared node ids. Optional for the flowchart mode.
    required: false
  participants:
    type: array
    description: Sequence participants, each {name, as?}. Names are sanitized like flowchart ids; the original name becomes the display alias when sanitization changed it and no explicit 'as' is given. Required for the sequence mode.
    required: false
  messages:
    type: array
    description: Sequence messages, each {from, to, text, kind?} with kind solid (-> default) or dashed (-->); from/to must reference declared participants. Required for the sequence mode.
    required: false
  notes:
    type: array
    description: Optional sequence notes, each {over, text} where over is one participant name or a list of one or two participant names. Sequence mode only.
    required: false
  source:
    type: string
    description: The Mermaid source string to lint (basic sanity pass, not a full parser). Required for the lint mode.
    required: false
args_model_schema:
  type: object
  properties:
    mode:
      type: string
      enum: ["flowchart", "sequence", "lint"]
      description: Diagram mode.
    direction:
      type: string
      enum: ["TD", "LR"]
      description: Flowchart direction (flowchart mode).
    nodes:
      type: array
      description: Flowchart node specs ({id, label?, shape?}).
      items:
        type: object
        properties:
          id:
            type: string
            description: Node identifier (sanitized to [A-Za-z0-9_]).
          label:
            type: string
            description: Optional node label (pipes become the look-alike ❘ character).
          shape:
            type: string
            enum: ["rect", "round", "stadium", "diamond", "hexagon", "circle", "parallelogram"]
            description: Node shape (default rect).
        required: ["id"]
    edges:
      type: array
      description: Flowchart edge specs ({from, to, label?, arrow?}).
      items:
        type: object
        properties:
          from:
            type: string
            description: Source node id (must be declared).
          to:
            type: string
            description: Target node id (must be declared).
          label:
            type: string
            description: Optional edge label (pipes become the look-alike ❘ character).
          arrow:
            type: string
            enum: ["arrow", "dotted", "thick"]
            description: Arrow style (default arrow).
        required: ["from", "to"]
    participants:
      type: array
      description: Sequence participant specs ({name, as?}).
      items:
        type: object
        properties:
          name:
            type: string
            description: Participant identifier (sanitized to [A-Za-z0-9_]).
          as:
            type: string
            description: Optional display alias.
        required: ["name"]
    messages:
      type: array
      description: Sequence message specs ({from, to, text, kind?}).
      items:
        type: object
        properties:
          from:
            type: string
            description: Sending participant name (must be declared).
          to:
            type: string
            description: Receiving participant name (must be declared).
          text:
            type: string
            description: Message text.
          kind:
            type: string
            enum: ["solid", "dashed"]
            description: Line style (default solid).
        required: ["from", "to", "text"]
    notes:
      type: array
      description: Sequence note specs ({over, text}).
      items:
        type: object
        properties:
          over:
            description: Participant name, or a list of one or two participant names.
          text:
            type: string
            description: Note text.
        required: ["over", "text"]
    source:
      type: string
      description: Mermaid source to lint (lint mode).
  required: ["mode"]
