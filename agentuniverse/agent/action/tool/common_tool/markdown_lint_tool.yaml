name: markdown_lint_tool
description: Whole-document Markdown quality linting — pure Python stdlib, no file I/O, no network, no third-party parser. lint mode checks a documented 16-rule table with full fence-interior immunity (CodeBlockDetector family fence tracking, mode='lint' — heading level jumps, multiple h1, empty headings, inconsistent closing hashes, mixed unordered markers -/*+, non-2-space list indents, tabs in list indent, unclosed code fences reported at the opening line, fences without a language, wrong-character closing fences, bare URLs, raw block-level HTML, 2-space hard-break ambiguity, over-120-character lines with a URL exemption, inconsistent sibling item capitalization, empty links []()/[text]()), each finding carrying code, severity, 1-based line, message and hint; profile mode reports the heading tree (per level, max depth, items), list and fence statistics with a language histogram, the internal/external link census, CJK-aware family-tokenizer word counts and 238-wpm reading stats (mode='profile'); fix_hints applies only safe textual repairs — closing an unclosed fence and stripping non-hard-break trailing whitespace — listing applied repairs and re-linting what remains with the caller's thresholds (mode='fix_hints'). CRLF and BOM inputs are normalized before scanning so line numbers match the LF twin.
tool_type: api
metadata:
  type: TOOL
  module: agentuniverse.agent.action.tool.common_tool.markdown_lint_tool
  class: MarkdownLintTool
input_keys:
  - mode
  - markdown_text
args_model:
  mode:
    type: string
    description: Tool mode — lint, profile or fix_hints.
    required: true
  markdown_text:
    type: string
    description: The Markdown text to examine. A single leading UTF-8 BOM is stripped silently and CRLF/CR line endings are normalized to LF before scanning. Required for every mode.
    required: true
  max_line_length:
    type: integer
    description: Width threshold for rule MD014 (line_too_long), measured after right-trimming whitespace; lines containing an http(s) URL are exempt. Default 120, range 40..500. Lint and fix_hints modes.
    required: false
  rules:
    type: object
    description: Map a rule code (MD001..MD016) to false to disable that single rule for the call, e.g. {"MD013":false}. Unknown codes or non-boolean values raise ValueError. Lint and fix_hints modes.
    required: false
  close_unclosed_fence:
    type: boolean
    description: In fix_hints mode, append a matching closing fence (same character and run length) for a fence left open at end of document. Default true. Fix_hints mode only.
    required: false
  strip_trailing_spaces:
    type: boolean
    description: In fix_hints mode, strip trailing whitespace on lines that do NOT end with two or more plain spaces (a CommonMark hard break is kept and only flagged by MD013). Fence lines and fence interiors are never touched. Default true. Fix_hints mode only.
    required: false
args_model_schema:
  type: object
  properties:
    mode:
      type: string
      enum: ["lint", "profile", "fix_hints"]
      description: Tool mode.
    markdown_text:
      type: string
      description: Markdown text (BOM and CRLF tolerated and normalized).
    max_line_length:
      type: integer
      minimum: 40
      maximum: 500
      description: MD014 width threshold (default 120; URL-bearing lines exempt).
    rules:
      type: object
      description: Per-rule enable/disable map, code -> boolean.
      additionalProperties:
        type: boolean
    close_unclosed_fence:
      type: boolean
      description: Append a closing fence when fixing (default true).
    strip_trailing_spaces:
      type: boolean
      description: Strip non-hard-break trailing whitespace when fixing (default true).
  required: ["mode", "markdown_text"]
