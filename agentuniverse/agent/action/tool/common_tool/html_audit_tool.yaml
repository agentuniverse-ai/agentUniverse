name: html_audit_tool
description: Static HTML fragment safety analysis. Audit dangerous constructs, diff tag allowlists, extract visible text, and report tag statistics.
tool_type: api
metadata: {type: TOOL, module: agentuniverse.agent.action.tool.common_tool.html_audit_tool, class: HtmlAuditTool}
input_keys: [html, mode]
max_input_chars: 1000000
max_tags: 20000
max_depth: 400
max_findings: 500
max_evidence_chars: 120
max_text_chars: 200000
args_model:
  html: {type: string, required: true}
  mode: {type: string, required: false, default: audit}
  allowed_tags: {type: array, required: false}
args_model_schema:
  type: object
  properties:
    html: {type: string}
    mode: {type: string, enum: [audit, allowlist_diff, text, stats], default: audit}
    allowed_tags: {type: array, items: {type: string}}
  required: [html, mode]
  additionalProperties: false
