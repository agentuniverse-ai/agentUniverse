name: duckduckgo_search_tool
description: >-
  Search DuckDuckGo without an API key. Supports web and news search and
  returns normalized structured result metadata.
tool_type: api
input_keys: [input]
max_results: 5
safesearch: moderate
search_type: text
backend: auto
timeout: 10
metadata:
  type: TOOL
  module: agentuniverse.agent.action.tool.common_tool.duckduckgo_search_tool
  class: DuckDuckGoSearchTool
args_model_schema:
  type: object
  properties:
    input:
      type: string
      minLength: 1
      description: Search query.
    search_type:
      type: string
      enum: [text, news]
      default: text
      description: Search web pages or recent news.
    max_results:
      type: integer
      minimum: 1
      maximum: 20
      default: 5
    region:
      type: string
      description: Optional DuckDuckGo region, for example us-en or cn-zh.
    safesearch:
      type: string
      enum: [on, moderate, off]
      default: moderate
    timelimit:
      type: string
      enum: [d, w, m, y]
      description: Optional day, week, month, or year recency filter.
    backend:
      type: string
      default: auto
      description: DuckDuckGo text-search backend; ignored for news.
  required: [input]
  additionalProperties: false
