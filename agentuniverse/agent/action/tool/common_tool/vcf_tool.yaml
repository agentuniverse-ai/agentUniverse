name: vcf_tool
description: vCard contact tool — pure Python stdlib, no network required. Parse VCARD text into structured contacts (mode='parse': BEGIN/END:VCARD blocks, vCard 2.1/3.0/4.0, FN/N/NICKNAME/ORG/TITLE/TEL/EMAIL/ADR/URL/NOTE/BDAY/CATEGORIES, 2.1-style bare and 3.0/4.0 TYPE= parameters, quoted-printable values, escape sequences and line folding), summarize an address book with per-contact FN and phone/email counts plus missing-FN flags (mode='summary'), or filter contacts by case-insensitive substring over FN/EMAIL/ORG/N fields (mode='filter').
tool_type: api
metadata:
  type: TOOL
  module: agentuniverse.agent.action.tool.common_tool.vcf_tool
  class: VcfTool
input_keys:
  - mode
args_model:
  mode:
    type: string
    description: vCard mode — parse, summary or filter.
    required: true
  text:
    type: string
    description: The VCARD text (one or more BEGIN:VCARD ... END:VCARD blocks). Required by every mode.
    required: false
  query:
    type: string
    description: Filter mode only — case-insensitive substring matched against the FN, EMAIL, ORG and N fields of every parsed contact.
    required: false
args_model_schema:
  type: object
  properties:
    mode:
      type: string
      enum: ["parse", "summary", "filter"]
      description: vCard mode.
    text:
      type: string
      description: VCARD text to parse (all modes).
    query:
      type: string
      description: Substring query over FN / EMAIL / ORG / N fields (filter mode).
  required: ["mode"]
