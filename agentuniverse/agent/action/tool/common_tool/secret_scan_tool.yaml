name: secret_scan_tool
description: Detect secrets and credentials in text with always-masked output.
tool_type: api
metadata:
  type: TOOL
  module: agentuniverse.agent.action.tool.common_tool.secret_scan_tool
  class: SecretScanTool
input_keys:
  - mode
  - text
max_input_bytes: 2097152
max_findings: 500
max_profile_lines: 200
max_candidates: 20000
max_token_chars: 4096
args_model_schema:
  type: object
  properties:
    mode:
      type: string
      enum: [scan, scan_entropy_profile, explain_rule, validate_token]
      description: Operation to run on the text.
    text:
      type: string
      description: Text to scan; required for scan and scan_entropy_profile.
    rule:
      type: string
      description: Rule name (or 'all'); required for explain_rule.
    token:
      type: string
      description: Candidate string; required for validate_token (never echoed).
    kind:
      type: string
      description: >
        Token kind for validate_token, e.g. aws-key, aws-secret, github-token,
        github-fine-grained-pat, google-api-key, slack-token, stripe-key,
        private-key-block, jwt, url-credentials.
  required: [mode, text]
  additionalProperties: false
