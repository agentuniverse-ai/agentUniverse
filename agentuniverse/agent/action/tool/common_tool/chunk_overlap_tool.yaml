name: chunk_overlap_tool
description: "Chunking QA tool — pure Python stdlib, no network required. Analyzes and validates the RESULT of any text splitter: given an existing chunk list (and optionally the source text it came from) it reports chunk size statistics (min/mean/median/max/total), textual overlap between consecutive chunks (exact suffix/prefix matching), positional adjacency (contiguous vs overlapping vs gapped char offsets), source coverage (covered_ratio, missing_spans, duplicated_regions via exact substring location, greedy in source order), a per-100-char-bucket coverage heatmap, a pairwise consecutive-window overlap matrix and policy validation (min_chars / max_chars / max_overlap / min_coverage, each rule with an independent pass/fail and offending indices). Offsets are code-point indices (CJK-safe). The companion of TextChunkerTool and the upstream splitters: those CREATE chunks, this tool checks them."
tool_type: api
metadata:
  type: TOOL
  module: agentuniverse.agent.action.tool.common_tool.chunk_overlap_tool
  class: ChunkOverlapTool
input_keys:
  - mode
args_model:
  mode:
    type: string
    description: Operation mode — analyze, coverage, overlap_matrix or validate.
    required: true
  chunks:
    type: array
    description: The chunk list to inspect — the output of any splitter (empty list allowed; empty strings allowed). At most 10,000 strings and 10 MB of text in total.
    required: false
  source_text:
    type: string
    description: The source the chunks came from. Optional in analyze (enables adjacency + coverage), required in coverage, rejected in overlap_matrix, and required in validate when the policy has a min_coverage rule. Capped at 10 MB.
    required: false
  window:
    type: integer
    description: overlap_matrix only — compare chunk i with chunks i+1 .. i+window (default 1 = consecutive pairs only; 1 to 100, at most 200,000 checked pairs).
    required: false
  policy:
    type: object
    description: validate only — a non-empty dict with any of min_chars (int >= 0), max_chars (int >= 1), max_overlap (int >= 0) and min_coverage (number 0..1, needs source_text).
    required: false
args_model_schema:
  type: object
  properties:
    mode:
      type: string
      enum: ["analyze", "coverage", "overlap_matrix", "validate"]
      description: Operation mode.
    chunks:
      type: array
      items:
        type: string
      description: The chunk list to inspect (output of any splitter).
    source_text:
      type: string
      description: The source the chunks came from (optional; enables coverage/adjacency).
    window:
      type: integer
      minimum: 1
      maximum: 100
      description: overlap_matrix window (default 1, consecutive pairs only).
    policy:
      type: object
      properties:
        min_chars:
          type: integer
          minimum: 0
          description: Every chunk must have at least this many characters.
        max_chars:
          type: integer
          minimum: 1
          description: Every chunk must have at most this many characters.
        max_overlap:
          type: integer
          minimum: 0
          description: Consecutive textual overlap (suffix/prefix match) must not exceed this many characters.
        min_coverage:
          type: number
          minimum: 0
          maximum: 1
          description: Located-span coverage of the source must be at least this ratio (requires source_text).
      description: Validation policy (validate mode).
  required: ["mode"]
