name: password_strength_tool
description: Offline password auditing with NIST SP 800-63B findings, transparent entropy estimates, and masked output.
tool_type: api
metadata:
  type: TOOL
  module: agentuniverse.agent.action.tool.common_tool.password_strength_tool
  class: PasswordStrengthTool
input_keys:
  - mode
max_password_chars: 1024
args_model_schema:
  type: object
  properties:
    mode:
      type: string
      enum: [audit, policy_check, entropy, compare]
    password:
      type: string
    password_b:
      type: string
      description: Second password for compare mode.
    username:
      type: string
      description: Optional associated username for context checks.
    min_length:
      type: integer
      default: 8
    max_length:
      type: integer
      default: 0
    require_lower:
      type: boolean
      default: false
    require_upper:
      type: boolean
      default: false
    require_digit:
      type: boolean
      default: false
    require_symbol:
      type: boolean
      default: false
  required: [mode]
  additionalProperties: false
