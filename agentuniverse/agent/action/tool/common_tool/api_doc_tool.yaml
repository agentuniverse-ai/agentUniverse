name: api_doc_tool
description: Offline OpenAPI document inspection and linting tool — pure Python stdlib plus core PyYAML, no network required, no request is ever sent. Summarize a spec's endpoints (mode='inventory') — openapi_version, title and an endpoint list (method, path, operation_id, summary, tags, params_count, has_request_body, responses_count) sorted by path+method, plus counts; path-item $refs are resolved and 3.1 webhooks are included. Lint a spec (mode='lint') for rule findings {code, severity, path, message} — invalid openapi/swagger version string, missing info title/version, empty paths and webhooks, missing responses, missing or duplicate operationIds, path template params undeclared or defined-but-unused, responses without description, duplicate parameter names per in-type, security referencing undefined schemes, deprecated operations without description, operations without error responses, missing servers, and dangling schema $refs via a cycle-guarded walk. Diff two spec versions (mode='diff', document = new, document_old = previous) — added/removed/changed endpoints with param and response deltas and a breaking flag true when endpoints, params or responses were removed. Accepts JSON and YAML document bodies (PyYAML is a core dependency); OpenAPI 3.x focus with documented best-effort handling of 2.0 (swagger) shapes.
tool_type: api
metadata:
  type: TOOL
  module: agentuniverse.agent.action.tool.common_tool.api_doc_tool
  class: ApiDocTool
input_keys:
  - mode
  - document
max_text: 1000000
args_model:
  mode:
    type: string
    description: Operation mode — inventory, lint or diff.
    required: true
  document:
    type: string
    description: The OpenAPI document TEXT to inspect (required in every mode; the NEW version in diff mode). JSON or YAML spelling. Capped at 1,000,000 characters.
    required: true
  document_old:
    type: string
    description: The PREVIOUS spec text — required in diff mode, ignored otherwise.
    required: false
args_model_schema:
  type: object
  properties:
    mode:
      type: string
      enum: ["inventory", "lint", "diff"]
      description: Operation mode.
    document:
      type: string
      description: The OpenAPI document text to inspect (new version in diff mode).
    document_old:
      type: string
      description: The previous spec text, diff mode only.
  required: ["mode", "document"]
  additionalProperties: false
