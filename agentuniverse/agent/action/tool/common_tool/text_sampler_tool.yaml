name: text_sampler_tool
description: Text sampler tool — pure Python stdlib, no network required. Extracts representative excerpts from long text instead of returning all of it: head + tail with an omission-count separator (mode='head_tail'), k evenly spaced windows of L characters at documented offsets (mode='evenly_spaced'), first/middle/last windows like an LLM context window (mode='strategic'), or a sentence-level outline of first + every Nth + last sentence (mode='outline_sample'). All modes report the samples, their exact spans, the total length and the sampled ratio.
tool_type: api
metadata:
  type: TOOL
  module: agentuniverse.agent.action.tool.common_tool.text_sampler_tool
  class: TextSamplerTool
input_keys:
  - mode
args_model:
  mode:
    type: string
    description: Sampling mode — head_tail, evenly_spaced, strategic or outline_sample.
    required: true
  text:
    type: string
    description: The text to sample. A non-empty string of at most 100,000 characters.
    required: true
  sample_size:
    type: integer
    description: head_tail and strategic modes — the size N of each excerpt in characters (head_tail uses N for the head and N for the tail).
    required: false
  sample_count:
    type: integer
    description: evenly_spaced mode — the number k of windows (1..100); outline_sample mode — the cap k on the number of sentences returned (1..100).
    required: false
  sample_length:
    type: integer
    description: evenly_spaced mode — the length L of every window in characters (1..100000).
    required: false
  every_n:
    type: integer
    description: outline_sample mode — the sentence stride N: after the first sentence, every Nth one is kept (1..10000).
    required: false
args_model_schema:
  type: object
  properties:
    mode:
      type: string
      enum: ["head_tail", "evenly_spaced", "strategic", "outline_sample"]
      description: Sampling mode.
    text:
      type: string
      description: The text to sample (non-empty, at most 100,000 characters).
    sample_size:
      type: integer
      description: Excerpt size N in characters (head_tail and strategic modes).
    sample_count:
      type: integer
      description: Number of windows k (evenly_spaced) or sentence cap k (outline_sample).
    sample_length:
      type: integer
      description: Window length L in characters (evenly_spaced mode).
    every_n:
      type: integer
      description: Sentence stride N (outline_sample mode).
  required: ["mode", "text"]
