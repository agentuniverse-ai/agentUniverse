name: import_graph_tool
description: Python import dependency mapping tool — pure stdlib ast, no execution and no network. Extracts every import statement from Python source text with line numbers, aliasing, relative levels, star/future flags and try/except conditional-import info (mode='scan'), classifies dependencies into stdlib (sys.stdlib_module_names), external and internal relative (mode='deps'), detects self-imports, star imports and conditional fallback chains per file and — over a {filename: source} batch — builds the filename-stem import graph with Tarjan cycle detection and orphan modules (mode='analyze'), and renders that graph as Graphviz DOT source with cycles highlighted dashed (mode='to_dot').
tool_type: api
metadata:
  type: TOOL
  module: agentuniverse.agent.action.tool.common_tool.import_graph_tool
  class: ImportGraphTool
input_keys:
  - mode
args_model:
  mode:
    type: string
    description: Analysis mode — scan (extract imports from one source text), deps (classify stdlib / external / internal), analyze (single-file anomalies or the multi-file import graph with cycles and orphans) or to_dot (render the multi-file graph as DOT source).
    required: true
  source:
    type: string
    description: Python source text. Required for scan and deps and for the single-file analyze form; must be omitted for the multi-file (files) forms.
    required: false
  files:
    type: object
    description: Mapping of .py / .pyi filenames to Python source text for the multi-file modes. Every file is one flat sibling module (its filename stem); two files with the same stem are rejected. Required for to_dot and the multi-file analyze form.
    required: false
  filename:
    type: string
    description: Optional filename for the single-file analyze form (default source.py); its stem is the module name used for self-import detection.
    required: false
  name:
    type: string
    description: Optional to_dot graph name (default imports; sanitized to [A-Za-z0-9_] with changes reported in id_mapping).
    required: false
args_model_schema:
  type: object
  properties:
    mode:
      type: string
      enum: ["scan", "deps", "analyze", "to_dot"]
      description: Analysis mode.
    source:
      type: string
      description: Python source text (scan / deps / single-file analyze).
    files:
      type: object
      description: Mapping of .py / .pyi filenames to Python source text (to_dot / multi-file analyze).
      additionalProperties:
        type: string
    filename:
      type: string
      description: Filename whose stem names the module for self-import detection (single-file analyze; default source.py).
    name:
      type: string
      description: Graph name for to_dot (sanitized to [A-Za-z0-9_]).
  required: ["mode"]
