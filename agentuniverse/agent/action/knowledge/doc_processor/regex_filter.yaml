name: 'regex_filter'
description: 'keep or drop documents whose text matches a set of regular expressions'

metadata:
  type: 'DOC_PROCESSOR'
  module: 'agentuniverse.agent.action.knowledge.doc_processor.regex_filter'
  class: 'RegexFilter'

# Python regular expressions. Each document's text is tested with re.search
# against every pattern: a document counts as matching when ANY pattern is
# found anywhere in the text, or ALL of them when require_all is true.
# An empty list is a no-op — every document is kept.
patterns: []

# 'keep_matching' (default) keeps documents that match the patterns;
# 'drop_matching' removes them.
mode: 'keep_matching'

# When false (default) a single matching pattern is enough; when true every
# pattern must match.
require_all: false

# When true (default) patterns keep standard Python regex semantics; when
# false they are compiled with re.IGNORECASE.
case_sensitive: true

# Metadata key the list of matched patterns (in configuration order) is
# written to on every processed document, kept and removed alike;
# '' disables stamping.
matched_key: 'regex_matched'
