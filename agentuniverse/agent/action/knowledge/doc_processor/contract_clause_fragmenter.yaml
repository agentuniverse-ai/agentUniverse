name: 'contract_clause_fragmenter'
description: 'Fragment legal contracts by individual clauses (numbered, lettered, CJK and ALLCAPS boilerplate markers) while preserving hierarchy and character spans'
preserve_hierarchy: true
min_clause_length: 10
extract_references: true
# References resolve to a complete target heading identifier. Section 1 does
# not match Section 10 or 1.1; mentions in another clause's body are not targets.
skip_on_error: true
keep_preamble: false            # keep the preamble and WHEREAS recital blocks as fragments
max_fragment_chars: 0           # split over-long clauses at sentence boundaries; 0 disables
clause_patterns:
  - '^Article\s+[IVX\d]+\.?\s*'
  - '^ARTICLE\s+[IVX\d]+\.?\s*'
  - '^Section\s+\d+(\.\d+)*\.?\s*'
  - '^SECTION\s+\d+(\.\d+)*\.?\s*'
  - '^\d+\.(\d+\.)*\s+'
  - '^\([a-zA-Z]\)\s*'
  - '^第[一二三四五六七八九十百千\d]+条\s*'
  - '^[一二三四五六七八九十百千\d]+、\s*'
  - '^[（(][一二三四五六七八九十百千\d]+[)）]\s*'
boilerplate_patterns:
  - '^WHEREAS\b[,\s]*'
  - '^NOW[,\s]+THEREFORE\b[,\s]*'
  - '^IN\s+WITNESS\s+WHEREOF\b[,\s]*'
metadata:
  type: 'DOC_PROCESSOR'
  module: 'agentuniverse.agent.action.knowledge.doc_processor.contract_clause_fragmenter'
  class: 'ContractClauseFragmenter'
